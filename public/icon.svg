<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft background aura glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F4F3EE" stop-opacity="1" />
    </radialGradient>

    <!-- Deep indigo modern gradient for the backbone -->
    <linearGradient id="backboneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" /> <!-- slate-900 -->
      <stop offset="100%" stop-color="#312E81" /> <!-- indigo-900 -->
    </linearGradient>

    <!-- Luminous intelligence gradient for the modern ribbon loop -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- indigo-600 -->
      <stop offset="35%" stop-color="#8B5CF6" /> <!-- violet-500 -->
      <stop offset="70%" stop-color="#EC4899" /> <!-- pink-500 -->
      <stop offset="100%" stop-color="#F59E0B" /> <!-- amber-500 -->
    </linearGradient>

    <!-- Dynamic 3D drop shadow filter for depth -->
    <filter id="modernShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.16" />
    </filter>

    <!-- Elegant inner glow / light reflection overlay -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Modern rounded background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGlow)" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#E2E8F0" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#EEF2F6" stroke-width="2" opacity="0.4" />

  <!-- Main modern Logo grouping with drop shadow -->
  <g filter="url(#modernShadow)">
    
    <!-- Sophisticated vertical backbone pill -->
    <rect x="160" y="110" width="46" height="292" rx="23" fill="url(#backboneGrad)" />
    
    <!-- Elegant Ribbon loop curves forming the B -->
    <path d="M 183 133 
             C 285 133, 350 148, 350 200 
             C 350 248, 275 256, 183 256 
             C 295 256, 370 262, 370 318 
             C 370 368, 290 379, 183 379" 
          stroke="url(#loopGrad)" 
          stroke-width="46" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Overlapping light highlight on top of vertical backbone for premium gloss effect -->
    <rect x="163" y="113" width="40" height="146" rx="20" fill="url(#highlightGrad)" pointer-events="none" />
    
    <!-- Infinite potential modern accent node (Tech/AI spark) -->
    <circle cx="350" cy="200" r="10" fill="#FFFFFF" opacity="0.9" />
    <circle cx="370" cy="318" r="10" fill="#FFFFFF" opacity="0.9" filter="blur(1px)" />

  </g>
</svg>
